name: Canvas APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'               # Auto-build when you push a version tag like v0.100.0
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Canvas-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ---- NEW: Auto-release when you push a tag ----
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')   # Only runs on tags like v0.100.1
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Canvas-debug
          path: apk/

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
