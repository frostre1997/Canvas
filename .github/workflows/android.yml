name: Canvas APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK 17 (required for Android Gradle Plugin 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Cache Gradle dependencies for faster builds
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Grant execute permission for Gradle wrapper
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # 5. Build the Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. Upload the APK as an artifact (downloadable from Actions tab)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Canvas-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30  # Keep the APK for 30 days
