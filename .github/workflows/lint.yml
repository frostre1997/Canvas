name: Run Android Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintDebug

      # Debug: verify the report exists
      - name: List lint report files
        run: |
          echo "Listing app/build/reports/"
          ls -la app/build/reports/ || true
          echo "Listing app/build/reports/lint-results*"
          ls -la app/build/reports/lint-results* || true
        if: always()

      - name: Report Lint Results
        uses: hidakatsuya/action-report-android-lint@v1
        with:
          result-path: 'app/build/reports/lint-results-debug.xml'
          fail-on-warning: true
          follow-symbolic-links: true
        if: always()
