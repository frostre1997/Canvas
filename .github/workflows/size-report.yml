name: APK Size Report

on:
  pull_request:
    branches:
      - master

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build base APK (from master)
        run: ./gradlew assembleDebug
        if: github.event_name == 'pull_request'

      - name: Upload APK size diff
        uses: adrianwudev/android-app-size-difference-action@v1
        with:
          base-apk-path: app/build/outputs/apk/debug/app-debug.apk
