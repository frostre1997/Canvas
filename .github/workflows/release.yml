name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact (from build)
        uses: actions/download-artifact@v4
        with:
          name: Canvas-debug
          path: apk/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
